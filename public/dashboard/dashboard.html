    <link rel="stylesheet" href="../css/dashboard.css">

<body>

    <div class="menu">

        <p>EM CONEXÃO</p>
        <ul>
            <li><strong><a href="dashboard.html">Dashboard</a></strong></li>
            <li><a href="../index.html">Página Inicial</a></li>
            <li><a href="../jornada.html">Sua Jornada</a></li>
        </ul>
        <div>
            <div class="img"><img src="../assets/menu.png" alt=""></div>
        </div>

        <div class="baixo">
            <div class="continuar">
                <h3>Continue sua jornada</h3> <br>
                <p>Conhecimentos Básicos da Umbanda</p>
                <button><a href="../jornada.html">Continuar Jornada</a></button>
            </div>

            <div class="lista">
                <h3>Quizzes disponíveis </h3> <br>
                <p>Fundamentos</p>
                <p>Orixás</p>
                <p>Entidades</p>
            </div>

        </div>

    </div>
    <div class="dashboard">

        <div class="container-kpi">

            <div class="kpi">
                <!--<div class="img"><img src="imgs/aprenda.svg" alt=""></div>-->
                <p>Quizzes feitos</p>
                <span>12</span>
            </div>

            <div class="kpi">
                <!--<div class="img"><img src="imgs/calendar.png" alt=""></div>-->
                <p>Última tentativa</p>
                <span>2 dias atrás</span>
            </div>

            <div class="kpi">
                <!--<div class="img"><img src="imgs/trofeu.png" alt=""></div>-->
                <p>Melhor resultado</p>
                <span>9/10</span>
            </div>
        </div>

        <div class="container-graficos">
            <div class="grafico">
                <canvas class="fundamentos" id="graficoFundamento"></canvas>
            </div>

            <div class="grafico">
                <canvas class="orixa" id="graficoOrixa"></canvas>
            </div>

            <div class="grafico">
                <canvas class="entidade" id="graficoEntidade"></canvas>
            </div>
        </div>


    </div>
</body>

</html>
<script>

    buscarDadosFundamentos();

    function buscarDadosFundamentos() {

        fetch("/dashboard/fundamentos")
            .then(function (resposta) {

                resposta.json().then(function (dados) {
                    console.log(dados);

                    let labels = [];
                    let resultados = [];

                    for (let i = 0; i < dados.length; i++) {
                        labels.push(dados[i].dataQuiz);
                        resultados.push(dados[i].resultado);
                    }
                    criarGraficoFundamentos(labels, resultados)
                });

            })
            .catch(function (erro) {
                console.log("Erro ao buscar dados:", erro);
            });
    }

    function criarGraficoFundamentos(labels, resultados) {

        const graficoFundamento = document.getElementById('graficoFundamento');

        new Chart(graficoFundamento, {
            type: 'line',

            data: {
                labels: labels,

                datasets: [{
                    label: 'Resultado',
                    data: resultados,
                    borderColor: '#4cc9f0',
                    borderDash: [5, 5],
                    borderWidth: 3
                }]
            },

            options: {
                responsive: true,
                maintainAspectRatio: false,

                scales: {
                    x: {
                        ticks: {
                            color: "#ffffff"
                        },

                        title: {
                            display: true,
                            text: 'Data',
                            color: "#fff"
                        }
                    },

                    y: {
                        beginAtZero: true,

                        ticks: {
                            color: "#ffffff"
                        },

                        title: {
                            display: true,
                            text: 'Resultado',
                            color: '#ffffff'
                        }
                    }
                },

                plugins: {
                    title: {
                        display: true,
                        text: 'Desempenho em Fundamentos',
                        color: '#ffffff'
                    },

                    legend: {
                        labels: {
                            color: '#ffffff'
                        }
                    }
                }
            }
        });
    }
