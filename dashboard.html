<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Caminho do Axé</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="header">
        <div class="logo">
            <img src="imgs/logo.png" alt="logo">
        </div>
        <div class="containerHeader">
            <div class="navbar">
                <a href="index.html">Página Inicial</a>
                <a href="jornada.html">Jornada</a>
                <a href="">Sobre mim</a>
            </div>
            <div class="user">
                <a href="login.html"><i class="fa-regular fa-user"></i></a>
            </div>
        </div>
    </div>

    <div class="dashboard">

        <div class="container-kpi">

            <div class="kpi">
                <p>Quizzes feitos</p>
                <span>12</span>
            </div>

            <div class="kpi">
                <p>Média de acertos</p>
                <span>75%</span>
            </div>

            <div class="kpi">
                <p>Última tentativa</p>
                <span>2 dias atrás</span>
            </div>

            <div class="kpi">
                <p>Melhor resultado</p>
                <span>9/10</span>
            </div>
        </div>

        <div class="container-graficos">
            <div class="grafico">
                <canvas id="graficoEvolucao"></canvas>
            </div>
        </div>
    </div>
</body>

</html>
<script>
    const graficoEvolucao = document.getElementById('graficoEvolucao');

    new Chart(graficoEvolucao, {
        type: 'line',
        data: {
            labels: [],
            datasets: [
                {
                    label: 'Resultado:',
                    data: [],
                    borderColor: '#146200',
                    borderDash: [5, 5],
                    borderWidth: 3
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    ticks: {
                        font: {
                            size: 13
                        },
                        color: "#146200"
                    },
                    title: {
                        font: {
                            size: 18
                        },
                        text: 'Data',
                        display: true,
                        color: "#fff"
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: 'Resultado',
                        color: '#146200'
                    },
                    beginAtZero: true,
                    ticks: {
                        font: {
                            size: 14
                        },
                        color: "#146200"
                    }
                }
            },
            plugins: {
                title: {
                    display: true,
                    text: 'Desempenho em Fundamentos',
                    color: '#146200',
                    font: {size: 16}
                },
                legend: {
                    labels: {
                        color: '#146200'
                    }
                }
            }
        }
    });
</script>
